services:
  petnote-sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /data
    ports:
      - "8787:8787"
    volumes:
      - petnote-data:/data

